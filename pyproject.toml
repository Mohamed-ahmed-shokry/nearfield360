[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nearfield360"
version = "0.1.0"
description = "Multi-camera fisheye perception and local environment mapping for automated parking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "NearField360 contributors" }]
keywords = [
  "automotive",
  "computer-vision",
  "fisheye",
  "parking",
  "perception",
  "surround-view",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.scripts]
nearfield360 = "nearfield360.cli:app"

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "twine>=7.0,<8",
  "types-pyyaml>=6.0.12.20241230",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/nearfield360"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["nearfield360"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "integration: exercises multiple project components",
  "slow: takes substantially longer than a unit test",
]

[tool.coverage.run]
branch = true
source = ["nearfield360"]
omit = ["src/nearfield360/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
