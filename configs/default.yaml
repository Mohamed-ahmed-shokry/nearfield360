paths:
  dataset_root: null
  output_root: outputs
runtime:
  device: auto
  seed: 42
logging:
  level: INFO
  structured: false
geometry:
  theta_max: 2.2
  ground_z: 0.0
  max_distance: 15.0
bev:
  x_min: -6.0
  x_max: 10.0
  y_min: -6.0
  y_max: 6.0
  resolution: 0.05
occupancy:
  free_classes:
    - road
    - lanemarks
    - curb
  occupied_classes:
    - person
    - rider
    - vehicles
    - bicycle
    - motorcycle
    - traffic_sign
  confidence_slope: 0.5
  min_evidence: 1
risk:
  front_length: 3.0
  rear_length: 3.0
  half_width: 0.9
  start_x: 0.0
  rear_start_x: 0.0
  lateral_width: 0.8
  vehicle_x_min: -2.0
  vehicle_x_max: 2.0
  near_radius: 0.5
  warning_radius: 1.5
  danger_occupancy: 0.5
robustness:
  severities:
    - 1
    - 2
    - 3
    - 4
    - 5
  rotation_perturbations_deg:
    - 0.5
    - 1.0
    - 2.0
    - 3.0
    - 5.0
  translation_perturbations_m:
    - 0.02
    - 0.05
    - 0.10
  seed: 42
health:
  soiling_threshold: 0.5
  blur_threshold: 100.0
  min_brightness: 15.0
  max_brightness: 240.0
  blockage_ratio_threshold: 0.4
  discount_factor: 0.5
tracking:
  dt: 0.1
  max_distance: 2.5
  min_hits: 3
  max_age: 5
  process_noise_pos: 0.5
  process_noise_vel: 1.0
  measurement_noise: 0.5
  forecast_horizon_s: 3.0
inference:
  backend: opencv
  device: cpu
  precision: fp32
  input_height: 480
  input_width: 640
  mean:
    - 0.485
    - 0.456
    - 0.406
  std:
    - 0.229
    - 0.224
    - 0.225
  confidence_threshold: 0.5
  nms_threshold: 0.4
  batch_size: 1
  tensorrt_workspace_mb: 1024
  tensorrt_cache_dir: null
  tensorrt_dla_core: null
forecast:
  horizon_seconds: 3.0
  step_seconds: 0.5
  memory_decay: 0.9
  flow_decay: 0.85
  min_velocity_threshold: 0.1
  diffusion_rate: 0.02
  spatial_kernel_size: 3
  hidden_channels: 16
slots:
  min_slot_width: 2.0
  max_slot_width: 3.8
  min_slot_length: 4.0
  max_slot_length: 8.0
  occupied_ratio_threshold: 0.20
  uncertain_ratio_threshold: 0.35
  min_confidence: 0.40
  approach_lead_distance: 1.5
  vehicle_width: 1.8
  vehicle_length: 4.5
  safety_margin: 0.25
planner:
  wheelbase: 2.7
  front_overhang: 0.9
  rear_overhang: 0.9
  vehicle_width: 1.8
  max_steer_angle_rad: 0.65
  max_speed: 1.5
  max_acceleration: 0.8
  step_size: 0.1
  dt: 0.1
  collision_margin: 0.15
  danger_threshold: 0.50
  uncertainty_threshold: 0.20
control:
  dt: 0.05
  lookahead_distance: 1.0
  stanley_k: 1.5
  stanley_soften_speed: 0.2
  kp_speed: 1.2
  ki_speed: 0.1
  max_steer_rate_rad_s: 0.8
  steer_time_constant_s: 0.15
  max_cross_track_error_m: 0.50
  max_heading_error_rad: 0.60
  emergency_brake_decel: 2.5
  collision_check_interval: 2
  terminal_dock_tol_xy: 0.15
  terminal_dock_tol_heading: 0.10
mission:
  hold_timeout_s: 5.0
  max_replans: 3
  replan_pull_out_dist_m: 1.5
  approach_speed_m_s: 1.0
  slot_tracking_distance_gate_m: 2.0
  slot_confirm_frames: 2
  slot_max_miss_frames: 5
  docking_tolerance_x_m: 0.20
  docking_tolerance_y_m: 0.15
  docking_tolerance_heading_rad: 0.08
  safety_dwell_steps: 10
mapping:
  default_lane_width_m: 3.5
  default_speed_limit_mps: 2.5
  turn_penalty_weight: 1.5
  odometry_noise_dist: 0.05
  odometry_noise_yaw: 0.02
  slot_association_gate_m: 2.5
  slot_observation_noise_pos: 0.20
  slot_observation_noise_yaw: 0.05
  max_localization_uncertainty_m: 1.5
  replan_reroute_on_blocked_lane: true

